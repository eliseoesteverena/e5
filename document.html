<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown a PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ============ m.min.css (base) ============ */
:root{
  --color-primary:#111030;
  --color-primary-light:rgba(17,16,48,0.8);
  --color-primary-dark:#08071f;
  --color-gray-50:#f0f8ff;
  --color-gray-100:#e8eef5;
  --color-gray-200:#d9dee5;
  --color-gray-500:#6b7280;
  --color-gray-700:#374151;
  --color-gray-900:#1f2937;
  --color-white:#ffffff;
  --color-accent:#1798e2;
  --color-accent-light:#8fbfde;
  --color-accent-dark:#006ca9;
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;--space-6:1.5rem;--space-8:2rem;
  --font-xs:0.75rem;--font-sm:0.875rem;--font-base:1rem;--font-lg:1.125rem;--font-xl:1.25rem;
  --font-2xl:1.5rem;--font-3xl:1.875rem;--font-4xl:2.25rem;
  --radius-sm:0.125rem;--radius-md:0.375rem;--radius-lg:0.5rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:18px;line-height:1.5}
body{font-family:'DM Sans',sans-serif;color:var(--color-gray-900);background-color:var(--color-gray-100)}

/* ============ UI de la herramienta ============ */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1.25rem;background:var(--color-primary);color:var(--color-white);flex-wrap:wrap}
.topbar h1{font-family:'DM Serif Display',serif;font-size:1.25rem;font-weight:400;color:var(--color-white)}
.topbar .actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{padding:.5rem 1rem;border:1px solid rgba(255,255,255,.3);border-radius:var(--radius-md);background:transparent;color:var(--color-white);font-size:var(--font-sm);font-weight:500;cursor:pointer;transition:.2s;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.12)}
.btn-accent{background:var(--color-accent);border-color:var(--color-accent)}
.btn-accent:hover{background:var(--color-accent-dark)}
.hamburger{display:none}
.mobile-tabs{display:none}

.main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.editor-pane,.preview-pane{display:flex;flex-direction:column;min-height:0}
.editor-pane{border-right:1px solid var(--color-gray-200)}
.pane-label{padding:.5rem 1rem;font-size:var(--font-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-gray-500);background:var(--color-gray-50);border-bottom:1px solid var(--color-gray-200)}
#md-input{flex:1;border:none;resize:none;padding:1.25rem;font-family:'Courier New',monospace;font-size:.9rem;line-height:1.6;background:var(--color-white);color:var(--color-gray-900)}
#md-input:focus{outline:none}
.preview-scroll{flex:1;overflow:auto;background:var(--color-gray-200);padding:1.5rem;display:flex;flex-direction:column;align-items:center}

/* Hoja A4 */
.page-sheet{position:relative;background:var(--color-white);width:210mm;min-height:297mm;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:10mm;margin-bottom:1.5rem}
.page-sheet + .page-sheet{page-break-before:always;break-before:page}
.sheet-header,.sheet-footer{position:absolute;left:0;right:0;height:10mm;display:flex;justify-content:center;align-items:center;padding:0 2mm;font-size:0.7rem;color:#9aa0a8;font-family:'DM Sans',sans-serif;text-align:center}
.sheet-header{top:3mm}
.sheet-footer{bottom:3mm}

/* Carátula */
.cover{display:flex;flex-direction:column;justify-content:space-between;height:277mm}
.cover-top{display:flex;justify-content:flex-end}
.cover-logo{max-width:140px;max-height:140px;object-fit:contain}
.cover-mid{margin-top:auto;margin-bottom:auto}
.cover-eyebrow{font-size:var(--font-sm);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent);margin-bottom:1.25rem}
.cover-title{font-family:'DM Serif Display',serif;font-size:2.75rem;line-height:1.15;color:var(--color-primary);margin-bottom:1rem}
.cover-subtitle{font-size:var(--font-lg);color:var(--color-gray-700);max-width:80%;white-space:pre-line}
.cover-bar{width:3rem;height:4px;background:var(--color-accent);margin:1.5rem 0}
.cover-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:var(--font-sm);color:var(--color-gray-500);border-top:1px solid var(--color-gray-200);padding-top:1rem}

/* Contenido renderizado */
.content{font-family:'DM Sans',sans-serif}
.content h1,.content h2,.content h3,.content h4,.content h5,.content h6{font-family:'DM Serif Display',serif;color:var(--color-primary);font-weight:400}
.content h1{font-size:var(--font-4xl);padding-bottom:.6rem;border-bottom:3px solid var(--color-accent);margin-bottom:1.25rem}
.content h2{font-size:var(--font-3xl);margin-top:1rem;margin-bottom:1rem}
.content h2::after{content:"";display:block;width:3rem;height:3px;background:var(--color-accent);margin-top:.5rem}
.content h3{font-size:var(--font-2xl);margin-top:.75rem}
.content h4{font-size:var(--font-xl)}
.content p{margin-bottom:.85rem;line-height:1.65;font-size:var(--font-base);color:var(--color-gray-900)}
.content a{color:var(--color-accent-dark);text-decoration:none}
.content a:hover{text-decoration:underline}
.content ul,.content ol{margin-bottom:.85rem;padding-left:1.5rem}
.content li{margin-bottom:.35rem;line-height:1.6}
.content li::marker{color:var(--color-accent);font-weight:700}
.content strong{font-weight:700;color:var(--color-primary)}
.content blockquote{padding:.85rem 1.25rem;margin:1rem 0;border-left:4px solid var(--color-accent);background:var(--color-gray-50);font-style:italic;color:var(--color-gray-700)}
.content code{padding:.15rem .4rem;background:var(--color-gray-100);border-radius:var(--radius-sm);font-family:'Courier New',monospace;font-size:var(--font-sm);color:var(--color-accent-dark)}
.content pre{padding:1rem;background:var(--color-primary-dark);color:var(--color-gray-100);border-radius:var(--radius-md);overflow-x:auto;margin-bottom:1rem;font-family:'Courier New',monospace;font-size:var(--font-sm);line-height:1.6}
.content pre code{padding:0;background:none;color:inherit}
.content table{width:100%;border-collapse:collapse;margin-bottom:1.25rem;font-size:var(--font-sm);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--color-gray-200)}
.content thead{background:var(--color-gray-100);color:var(--color-primary)}
.content th{padding:.5rem .75rem;text-align:left;font-weight:600;border-bottom:1px solid var(--color-gray-200)}
.content td{padding:.5rem .75rem;border-bottom:1px solid var(--color-gray-200)}
.content tbody tr:nth-child(even){background:var(--color-gray-50)}
.content hr{border:none;height:1px;background:var(--color-gray-200);margin:1.25rem 0}
.content table,.content tr,.content thead,.content img,.content pre,.content blockquote{page-break-inside:avoid}


/* ============ Modal de configuración ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(8,7,31,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--color-white);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:1.5rem}
.modal h2{font-size:var(--font-xl);color:var(--color-primary);margin-bottom:.25rem}
.modal .sub{color:var(--color-gray-500);font-size:var(--font-sm);margin-bottom:1.25rem}
.field{margin-bottom:.9rem}
.field label{display:block;margin-bottom:.25rem;font-weight:500;color:var(--color-gray-700);font-size:var(--font-sm)}
.field input,.field textarea{width:100%;padding:.5rem .65rem;border:1px solid var(--color-gray-200);border-radius:var(--radius-md);font-size:var(--font-base);font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(23,152,226,.15)}
.field-row{display:flex;gap:.75rem}
.field-row .field{flex:1}
.section-title{font-size:var(--font-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-gray-500);margin:1.25rem 0 .5rem;border-top:1px solid var(--color-gray-200);padding-top:1rem}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem}
.btn-primary{background:var(--color-primary);color:var(--color-white);border:none;padding:.6rem 1.25rem;border-radius:var(--radius-md);cursor:pointer;font-weight:500;font-family:inherit}
.btn-secondary{background:var(--color-gray-100);color:var(--color-gray-700);border:none;padding:.6rem 1.25rem;border-radius:var(--radius-md);cursor:pointer;font-weight:500;font-family:inherit}
.checkbox-item{display:flex;align-items:center;gap:.5rem}
.checkbox-item input{width:auto}

/* Loading PDF */
.btn[disabled]{opacity:.6;cursor:not-allowed}

/* Modo exportación directa (html2canvas): que cada hoja capture limpia, sin sombra/gap */
.exporting-pdf .page-sheet{box-shadow:none;margin-bottom:0}
@media screen and (max-width:880px){
  .topbar{position:relative}
  .topbar h1{font-size:1.05rem}
  .hamburger{display:flex;padding:.5rem .75rem}
  .topbar .actions{
    display:none;position:absolute;top:100%;left:0;right:0;
    flex-direction:column;background:var(--color-primary-dark);
    padding:.5rem .75rem .75rem;gap:.5rem;z-index:40;
    box-shadow:0 6px 12px rgba(0,0,0,.25)
  }
  .topbar .actions.open{display:flex}
  .topbar .actions .btn{width:100%}

  .mobile-tabs{display:flex}
  .tab-btn{flex:1;padding:.6rem;border:none;background:var(--color-gray-50);color:var(--color-gray-700);font-weight:500;font-size:var(--font-sm);font-family:inherit;cursor:pointer;border-bottom:2px solid var(--color-gray-200)}
  .tab-btn.active{color:var(--color-primary);border-bottom-color:var(--color-accent);background:var(--color-white)}

  .main{grid-template-columns:1fr;display:flex;flex-direction:column;flex:1;min-height:0}
  .editor-pane,.preview-pane{height:auto;flex:1;min-height:0}
  .editor-pane{border-right:none}
  .main.show-editor .preview-pane,
  .main.show-preview .editor-pane,
  .main.show-editor .pane-label,
  .main.show-preview .pane-label{display:none}

  /* Vista previa aislada: fondo propio, hojas a escala para verlas completas */
  .preview-scroll{background:var(--color-primary-dark);padding:1rem .5rem;align-items:center}
  #contenido-pdf{zoom:0.4}
  .page-sheet{width:210mm;min-height:297mm;padding:10mm}
  .cover{height:277mm}

  .exporting-pdf #contenido-pdf{zoom:1}
}

/* ============ Impresión ============ */
@page{size:A4;margin:0}
@media print{
  html,body{height:auto}
  .app{height:auto;display:block}
  .topbar,.editor-pane,.pane-label,.modal-overlay{display:none!important}
  .main{display:block}
  .preview-pane{height:auto}
  .preview-scroll{overflow:visible;padding:0;background:none;display:block}
  .page-sheet{box-shadow:none;margin:0;width:auto;min-height:297mm;padding:10mm}
}

</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>Markdown → PDF</h1>
    <button class="btn hamburger" id="btn-menu" aria-label="Menú">☰</button>
    <div class="actions" id="topbar-actions">
      <button class="btn" id="btn-config">⚙ Configuración</button>
      <button class="btn" id="btn-export">🖨 Imprimir</button>
      <button class="btn btn-accent" id="btn-export-pdf">⬇ Descargar PDF</button>
    </div>
  </header>

  <div class="mobile-tabs">
    <button class="tab-btn active" data-tab="editor">Markdown</button>
    <button class="tab-btn" data-tab="preview">Vista previa</button>
  </div>

  <div class="main" id="main-panes">
    <div class="editor-pane">
      <div class="pane-label">Markdown</div>
      <textarea id="md-input" placeholder="# Título del documento

Escribí o pegá tu contenido en markdown acá...

## Sección

- Punto uno
- Punto dos

| Columna A | Columna B |
|---|---|
| valor | valor |"></textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-label">Vista previa (A4)</div>
      <div class="preview-scroll">
        <div id="contenido-pdf">
          <!-- Carátula -->
          <div class="page-sheet cover" id="cover-page">
            <div class="cover-top"><img id="cover-logo" class="cover-logo" style="display:none" alt="Logo"></div>
            <div class="cover-mid">
              <div class="cover-eyebrow" id="cover-eyebrow"></div>
              <div class="cover-title" id="cover-title">Título del documento</div>
              <div class="cover-bar"></div>
              <div class="cover-subtitle" id="cover-subtitle">Subtítulo o descripción breve del documento.</div>
            </div>
            <div class="cover-bottom">
              <span id="cover-cliente"></span>
              <span id="cover-fecha"></span>
            </div>
          </div>
          <!-- Contenido (paginado dinámicamente por JS) -->
          <div id="content-pages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Configuración -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Configuración del documento</h2>
    <p class="sub">Estos datos se guardan en este navegador y se completan automáticamente la próxima vez.</p>

    <div class="section-title">Carátula</div>
    <div class="field"><label>Título</label><input type="text" id="cfg-titulo" placeholder="Título del documento"></div>
    <div class="field"><label>Subtítulo / descripción</label><textarea id="cfg-subtitulo" rows="2" placeholder="Subtítulo o descripción breve"></textarea></div>
    <div class="field"><label>Eyebrow (texto pequeño superior, ej: PROPUESTA)</label><input type="text" id="cfg-eyebrow" placeholder="PROPUESTA"></div>
    <div class="field-row">
      <div class="field"><label>Cliente / destinatario</label><input type="text" id="cfg-cliente" placeholder="Nombre del cliente"></div>
      <div class="field"><label>Fecha</label><input type="text" id="cfg-fecha" placeholder="Junio 2026"></div>
    </div>
    <div class="field"><label>URL del logo (opcional)</label><input type="text" id="cfg-logo" placeholder="https://..."></div>

    <div class="section-title">Encabezado y pie de página del PDF</div>
    <div class="field"><label>Texto de encabezado (en cada página)</label><input type="text" id="cfg-header" placeholder="Ej: Nombre de tu estudio · Confidencial"></div>
    <div class="field"><label>Texto de pie de página (en cada página)</label><input type="text" id="cfg-footer" placeholder="Ej: contacto@estudio.com"></div>

    <div class="field"><label>Título del documento (sugerido al guardar el PDF)</label><input type="text" id="cfg-filename" placeholder="documento"></div>

    <div class="modal-actions">
      <button class="btn-secondary" id="btn-config-close">Cancelar</button>
      <button class="btn-primary" id="btn-config-save">Guardar</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'md2pdf_config_v1';

const els = {
  mdInput: document.getElementById('md-input'),
  contentPages: document.getElementById('content-pages'),
  coverTitle: document.getElementById('cover-title'),
  coverSubtitle: document.getElementById('cover-subtitle'),
  coverEyebrow: document.getElementById('cover-eyebrow'),
  coverCliente: document.getElementById('cover-cliente'),
  coverFecha: document.getElementById('cover-fecha'),
  coverLogo: document.getElementById('cover-logo'),
  modalOverlay: document.getElementById('modal-overlay'),
};

const cfgFields = ['titulo','subtitulo','eyebrow','cliente','fecha','logo','header','footer','filename'];

function loadConfig(){
  let cfg = {};
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) cfg = JSON.parse(raw);
  }catch(e){ cfg = {}; }
  cfgFields.forEach(f=>{
    const el = document.getElementById('cfg-'+f);
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!cfg[f];
    else el.value = cfg[f] || '';
  });
  applyConfig(cfg);
}

function getConfigFromForm(){
  const cfg = {};
  cfgFields.forEach(f=>{
    const el = document.getElementById('cfg-'+f);
    if(!el) return;
    cfg[f] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return cfg;
}

let currentConfig = {};

function applyConfig(cfg){
  currentConfig = cfg;
  els.coverTitle.textContent = cfg.titulo || 'Título del documento';
  els.coverSubtitle.textContent = cfg.subtitulo || '';
  els.coverEyebrow.textContent = cfg.eyebrow || '';
  els.coverEyebrow.style.display = cfg.eyebrow ? '' : 'none';
  els.coverCliente.textContent = cfg.cliente || '';
  els.coverFecha.textContent = cfg.fecha || '';
  if(cfg.logo){
    els.coverLogo.src = cfg.logo;
    els.coverLogo.style.display = '';
  } else {
    els.coverLogo.style.display = 'none';
  }
  document.title = (cfg.filename && cfg.filename.trim()) || (cfg.titulo && cfg.titulo.trim()) || 'documento';
  renderMarkdown();
}

function saveConfig(){
  const cfg = getConfigFromForm();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  applyConfig(cfg);
}

// --- Render + paginar markdown ---
// Alto útil de contenido por hoja.
// En teoría sería 297mm - 2*10mm de padding = 277mm, pero la métrica del
// motor de impresión no coincide 1:1 con getBoundingClientRect: hay
// pequeñas diferencias de redondeo en márgenes/line-height de cada
// elemento (p, li, etc.) que se acumulan a lo largo de la página. Se usa
// un valor empírico más conservador para que la paginación coincida con
// el resultado real impreso.
const PAGE_CONTENT_HEIGHT_PX = 235 * 96 / 25.4;

function renderMarkdown(){
  const md = els.mdInput.value;

  // Contenedor de medición oculto, mismo ancho que el área de contenido (210mm - 2*10mm padding)
  const measure = document.createElement('div');
  measure.className = 'content';
  measure.style.position = 'absolute';
  measure.style.visibility = 'hidden';
  measure.style.left = '-9999px';
  measure.style.top = '0';
  measure.style.width = '190mm';
  measure.innerHTML = marked.parse(md);
  document.body.appendChild(measure);

  const nodes = Array.from(measure.children);
  const pages = [[]];
  let currentHeight = 0;

  nodes.forEach((node, idx) => {
    const h = node.getBoundingClientRect().height;
    const overflow = (currentHeight + h) > PAGE_CONTENT_HEIGHT_PX;
    const currentPage = pages[pages.length - 1];

    if (overflow && currentPage.length > 0) {
      pages.push([]);
      currentHeight = 0;
    }
    pages[pages.length - 1].push(node);
    currentHeight += h;
  });

  document.body.removeChild(measure);

  // Reconstruir #content-pages con una hoja A4 por página
  els.contentPages.innerHTML = '';
  pages.forEach(pageNodes => {
    const sheet = document.createElement('div');
    sheet.className = 'page-sheet content-page';

    if(currentConfig.header){
      const header = document.createElement('div');
      header.className = 'sheet-header';
      header.textContent = currentConfig.header;
      sheet.appendChild(header);
    }

    const content = document.createElement('div');
    content.className = 'content';
    pageNodes.forEach(n => content.appendChild(n));
    sheet.appendChild(content);

    if(currentConfig.footer){
      const footer = document.createElement('div');
      footer.className = 'sheet-footer';
      footer.textContent = currentConfig.footer;
      sheet.appendChild(footer);
    }

    els.contentPages.appendChild(sheet);
  });
}

els.mdInput.addEventListener('input', renderMarkdown);

// --- Menú móvil (hamburguesa) ---
const topbarActions = document.getElementById('topbar-actions');
document.getElementById('btn-menu').addEventListener('click', ()=>{
  topbarActions.classList.toggle('open');
});
topbarActions.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click', ()=> topbarActions.classList.remove('open'));
});

// --- Tabs móviles: Markdown / Vista previa ---
const mainPanes = document.getElementById('main-panes');
document.querySelectorAll('.tab-btn').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    mainPanes.classList.remove('show-editor','show-preview');
    mainPanes.classList.add(tab.dataset.tab === 'editor' ? 'show-editor' : 'show-preview');
  });
});
mainPanes.classList.add('show-editor');

// --- Modal ---
document.getElementById('btn-config').addEventListener('click', ()=>{
  els.modalOverlay.classList.add('open');
});
document.getElementById('btn-config-close').addEventListener('click', ()=>{
  els.modalOverlay.classList.remove('open');
});
document.getElementById('btn-config-save').addEventListener('click', ()=>{
  saveConfig();
  els.modalOverlay.classList.remove('open');
});
els.modalOverlay.addEventListener('click', (e)=>{
  if(e.target === els.modalOverlay) els.modalOverlay.classList.remove('open');
});

// --- Exportar / Imprimir ---
document.getElementById('btn-export').addEventListener('click', ()=>{
  window.print();
});

// --- Descarga directa de PDF (fiel a la vista previa) ---
document.getElementById('btn-export-pdf').addEventListener('click', async ()=>{
  const btn = document.getElementById('btn-export-pdf');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando...';
  document.body.classList.add('exporting-pdf');

  try{
    const { jsPDF } = window.jspdf;
    const sheets = document.querySelectorAll('#contenido-pdf .page-sheet');
    let pdf;

    for(let i = 0; i < sheets.length; i++){
      const canvas = await html2canvas(sheets[i], { scale: 3, useCORS: true });
      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      if(!pdf){
        pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
      } else {
        pdf.addPage();
      }
      pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
    }

    const base = (currentConfig.filename && currentConfig.filename.trim())
      || (currentConfig.titulo && currentConfig.titulo.trim())
      || 'documento';
    pdf.save(base.replace(/\.pdf$/i, '') + '.pdf');
  } finally {
    document.body.classList.remove('exporting-pdf');
    btn.disabled = false;
    btn.textContent = original;
  }
});

// Init
loadConfig();
</script>
</body>
</html>
